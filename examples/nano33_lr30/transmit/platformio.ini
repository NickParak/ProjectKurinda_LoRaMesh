[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
lib_deps =
    jgromes/RadioLib@7.7.1
monitor_speed = 115200
build_flags =
    -D RADIOLIB_DEBUG_BASIC

[env:esp32-c3]    
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    https://github.com/LoRaMesher/LoRaMesher#new_loramesher
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1